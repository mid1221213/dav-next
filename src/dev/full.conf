# --- Log format: full request metadata + headers + bodies ---
log_format proxy_full escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"req_headers":"$req_headers_all",'
        '"req_body":"$request_body",'
        '"resp_headers":"$resp_headers_all",'
        '"resp_body":"$resp_body"'
    '}';

# Buffer response body so we can log it (Lua)
lua_shared_dict resp_bodies 16m;

server {
    listen 8080;
    server_name _;

    # Required so $request_body is populated for all methods/sizes
    client_body_buffer_size 10m;
    client_max_body_size    50m;

    # --- Capture ALL request headers into one variable (Lua) ---
    # Requires nginx built with lua-nginx-module (or use OpenResty)
    lua_need_request_body on;

    # Pre-request: snapshot all request headers
    set $req_headers_all '';
    set $resp_headers_all '';
    set $req_body '';
    set $resp_body '';

    log_by_lua_block {
        local data = ngx.req.get_body_data()

        if not data then
            local file_name = ngx.req.get_body_file()
            if file_name then
                -- You would need to read the file here if necessary
                data = "Body stored in file: " .. file_name
            else
                data = "No body found"
            end
        end

        ngx.var.req_body = data
    }

    access_by_lua_block {
        local cjson = require "cjson"

        ngx.var.req_headers_all = cjson.encode(ngx.req.get_headers(0, true))

    }
    # Capture response body chunk-by-chunk
    body_filter_by_lua_block {
        local chunk = ngx.arg[1]
        local ctx = ngx.ctx
        ctx.buf = (ctx.buf or "") .. (chunk or "")
        if ngx.arg[2] then           -- last chunk
            ngx.var.resp_body = ctx.buf
        end
    }

    # Capture response headers after upstream replies
    header_filter_by_lua_block {
        local cjson = require "cjson"

        ngx.var.resp_headers_all = cjson.encode(ngx.resp.get_headers(0, true))
    }

    access_log /var/log/nginx/proxy_full.log proxy_full;
    error_log  stderr info;

    location / {
        proxy_pass         http://localhost:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering tweaks that would defeat body capture
        proxy_buffering           on;
        proxy_request_buffering   on;
    }
}
